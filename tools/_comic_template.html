<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__ · 漫画分镜 · 阅读导读</title>
<style>
  :root{
    --ink:#1c1714; --paper:#f4ead2; --paper2:#ead9b6;
    --red:#b5302a; --gold:#c9971f; --jade:#3c7d5a;
    --line:#2a2018;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 20% 10%, #fbf3df 0%, transparent 55%),
      radial-gradient(circle at 80% 90%, #efe1c2 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"KaiTi","STKaiti","Songti SC","SimSun",serif;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.06;z-index:0;
    background-image:repeating-linear-gradient(0deg,#000 0 1px,transparent 1px 3px);
  }
  .wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:26px 18px 60px;}
  .back-link{display:inline-block;margin:0 0 14px;color:var(--red);text-decoration:none;font-size:14px;
    border:1.5px solid var(--red);border-radius:16px;padding:4px 14px;transition:background .15s,color .15s;}
  .back-link:hover{background:var(--red);color:#fff;}
  .missing-lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff3d6;font-size:13px;z-index:3;text-shadow:0 1px 3px rgba(0,0,0,.6);padding:0 20px;text-align:center;line-height:1.6;}

  /* 报头 */
  .masthead{
    display:flex;align-items:flex-end;gap:16px;justify-content:center;
    border-bottom:3px double var(--line);padding-bottom:14px;margin-bottom:12px;
  }
  .title-v{
    writing-mode:vertical-rl;text-orientation:upright;
    font-size:40px;font-weight:700;letter-spacing:6px;color:var(--red);
    text-shadow:1px 1px 0 #fff,2px 2px 0 rgba(0,0,0,.15);
  }
  .title-sub{font-size:15px;color:#6b5a44;line-height:1.7;text-align:left;}
  .title-sub b{color:var(--ink);font-size:17px;}
  .seal{
    align-self:center;width:58px;height:58px;border:2px solid var(--red);border-radius:6px;
    color:var(--red);display:flex;align-items:center;justify-content:center;
    font-size:13px;line-height:1.1;text-align:center;transform:rotate(-6deg);
    box-shadow:inset 0 0 0 2px #fff;background:rgba(181,48,42,.06);
  }

  /* 重点精读徽章条 + 回目出处 */
  .feature-bar{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin:0 0 14px;padding:9px 14px;border-radius:8px;
    background:linear-gradient(90deg,#f6e7bd,#f0d9a0);
    border:2px solid var(--gold);box-shadow:2px 3px 0 rgba(0,0,0,.12);
  }
  .feature-badge{
    background:var(--red);color:#fff;font-size:13px;font-weight:700;letter-spacing:1px;
    padding:4px 12px;border-radius:14px;white-space:nowrap;box-shadow:1px 1px 0 rgba(0,0,0,.2);
  }
  .huimu{font-size:14px;color:#7a5210;line-height:1.5;}
  .huimu b{color:var(--ink);}
  .huimu .hm{color:var(--jade);font-weight:700;}

  /* 页内目录 */
  .toc{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px;}
  .toc a{font-size:12.5px;color:var(--jade);text-decoration:none;border:1px solid var(--jade);
    border-radius:14px;padding:3px 11px;transition:background .15s,color .15s;}
  .toc a:hover{background:var(--jade);color:#fff;}

  /* 整回导读 */
  .lead{
    background:linear-gradient(180deg,#fffaf0,#f6ead0);
    border:2px solid var(--line);border-left:7px solid var(--red);
    border-radius:8px;padding:16px 20px;margin-bottom:22px;line-height:1.85;font-size:15px;
    box-shadow:3px 4px 0 rgba(0,0,0,.12);
  }
  .lead h2{margin:0 0 8px;font-size:18px;color:var(--red);letter-spacing:2px;}
  .lead p{margin:0 0 8px;}
  .lead .q{color:var(--jade);font-weight:700;}

  /* 漫画网格 */
  .comic{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .panel{position:relative;border:4px solid var(--line);background:#17120e;
    box-shadow:4px 5px 0 rgba(0,0,0,.18);overflow:hidden;aspect-ratio:3 / 2;cursor:zoom-in;}
  .panel.span2{grid-column:1 / -1;}
  .panel .shot{position:absolute;inset:0;background-repeat:no-repeat;background-color:#17120e;
    background-position:center;background-size:contain;}
  .panel .scan{position:absolute;inset:0;background:
    repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0 2px,transparent 2px 4px);mix-blend-mode:multiply;opacity:.25;}
  .panel .vig{position:absolute;inset:0;box-shadow:inset 0 0 60px rgba(0,0,0,.45);}
  .panel .badge{position:absolute;top:8px;right:8px;z-index:6;background:var(--red);color:#fff;
    font-size:12px;padding:2px 9px;border-radius:12px;box-shadow:1px 1px 0 rgba(0,0,0,.3);}

  /* 旁白框 */
  .caption{position:absolute;top:8px;left:8px;max-width:74%;
    background:rgba(20,16,12,.82);color:#f6ecd6;font-size:13px;line-height:1.55;
    padding:6px 9px;border-left:3px solid var(--gold);z-index:4;}

  /* 对白气泡 */
  .bubble{position:absolute;z-index:5;max-width:62%;
    background:#fffdf6;border:2.5px solid var(--line);border-radius:14px;
    padding:8px 11px;font-size:13.5px;line-height:1.5;color:#211a14;
    box-shadow:2px 2px 0 rgba(0,0,0,.2);}
  .bubble::after{content:"";position:absolute;width:0;height:0;
    border:9px solid transparent;border-top-color:var(--line);
    bottom:-16px;left:24px;}
  .bubble::before{content:"";position:absolute;width:0;height:0;
    border:7px solid transparent;border-top-color:#fffdf6;bottom:-11px;left:26px;z-index:1;}
  .bubble .who{display:block;font-size:11px;color:var(--red);font-weight:700;margin-bottom:2px;letter-spacing:1px;}
  .bubble.demon{border-color:var(--red);background:#fff4f1;}
  .bubble.demon .who{color:var(--red);}
  .bubble.demon::after{border-top-color:var(--red);}
  .bubble.god{border-color:var(--gold);background:#fffaf0;}
  .bubble.god .who{color:var(--gold);}
  .bubble.god::after{border-top-color:var(--gold);}
  .bubble.r::after{left:auto;right:24px;} .bubble.r::before{left:auto;right:26px;}
  .bubble.t::after{border-top-color:transparent;border-bottom-color:var(--line);top:-16px;bottom:auto;left:24px;}
  .bubble.t::before{border-top-color:transparent;border-bottom-color:#fffdf6;top:-11px;bottom:auto;left:26px;}

  /* 拟声 */
  .sfx{position:absolute;z-index:6;font-size:34px;font-weight:900;color:var(--red);
    transform:rotate(-12deg);text-shadow:2px 2px 0 #fff,4px 4px 0 rgba(0,0,0,.25);
    letter-spacing:2px;font-family:"Heiti SC","SimHei",sans-serif;pointer-events:none;}

  .toolbar{display:flex;gap:10px;justify-content:center;margin:24px 0 8px;flex-wrap:wrap;}
  .toolbar button{font-family:inherit;font-size:14px;padding:8px 18px;cursor:pointer;
    background:var(--red);color:#fff;border:none;border-radius:20px;box-shadow:2px 2px 0 rgba(0,0,0,.2);}
  .toolbar button.ghost{background:#fff;color:var(--red);border:2px solid var(--red);}
  .toolbar button:active{transform:translate(1px,1px);}

  .note{font-size:12.5px;color:#6b5a44;text-align:center;margin-top:14px;line-height:1.7;}

  /* 研读笔记（主页面展开） */
  .studies{display:none;margin-top:18px;}
  .studies.open{display:block;}
  .study-card{border:2px solid var(--line);border-radius:8px;background:#fffaf0;
    margin-bottom:16px;overflow:hidden;box-shadow:3px 4px 0 rgba(0,0,0,.1);}
  .study-card .head{display:flex;align-items:center;gap:12px;background:var(--ink);color:#f4ead2;padding:8px 14px;}
  .study-card .head b{font-size:15px;color:#f4ead2;letter-spacing:1px;}
  .study-card .head img{width:54px;height:36px;object-fit:cover;border:2px solid var(--gold);border-radius:4px;}
  .study-card .body{padding:14px 18px;}

  /* 研读区块通用 */
  .sec{margin-bottom:13px;}
  .sec:last-child{margin-bottom:0;}
  .sec h4{margin:0 0 6px;font-size:15px;color:var(--red);
    border-left:4px solid var(--gold);padding-left:8px;letter-spacing:1px;}
  .sec p{margin:0;line-height:1.8;font-size:14px;}
  .sec ul{margin:4px 0 0;padding-left:20px;}
  .sec li{line-height:1.75;margin:3px 0;font-size:14px;}

  /* 分类语料卡：好词 / 佳句 / 修辞 */
  .vw{margin:4px 0 0 !important;padding-left:18px !important;list-style:none;}
  .vw li{margin:5px 0 !important;font-size:13.5px !important;line-height:1.7 !important;
    padding-left:14px;position:relative;}
  .vw li::before{content:"◆";position:absolute;left:0;top:2px;color:var(--gold);font-size:10px;}
  .vw b{color:var(--ink);background:#fbeccf;border:1px solid var(--gold);border-radius:5px;
    padding:0 7px;margin-right:2px;font-size:13px;}
  .vw .wm{color:#6b5a44;}
  .vq{margin:8px 0 0;padding:8px 12px;background:#fdf6e3;border-left:3px solid var(--gold);
    border-radius:4px;}
  .vq p{margin:0;font-size:14px;color:#3a2c16;line-height:1.7;}
  .vq cite{display:block;font-style:normal;font-size:12px;color:var(--jade);margin-top:3px;}
  .vq .vm{display:block;font-size:13px;color:#6b5a44;margin-top:3px;line-height:1.65;}
  .rhet li b{background:#e9f2ec;border-color:var(--jade);}

  /* 人物小档案 */
  .section-title{font-size:19px;color:var(--red);letter-spacing:3px;margin:34px 0 14px;
    border-bottom:2px solid var(--line);padding-bottom:6px;scroll-margin-top:14px;}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .card{border:2px solid var(--line);border-radius:8px;padding:14px 15px;background:#fffaf0;
    box-shadow:3px 4px 0 rgba(0,0,0,.1);}
  .card h3{margin:0 0 8px;font-size:16px;color:var(--red);text-align:center;
    border-bottom:1px dashed var(--gold);padding-bottom:6px;}
  .card p{margin:0;font-size:13.5px;line-height:1.8;}

  /* 主题探究 / 阅读贴士 */
  .prose{border:2px solid var(--line);border-radius:8px;background:linear-gradient(180deg,#fffaf0,#f6ead0);
    padding:16px 20px;line-height:1.9;font-size:14.5px;box-shadow:3px 4px 0 rgba(0,0,0,.1);}
  .prose h3{color:var(--jade);margin:14px 0 6px;font-size:15.5px;}
  .prose h3:first-child{margin-top:0;}
  .prose ul{margin:4px 0;padding-left:22px;} .prose li{margin:4px 0;}

  /* 重点精读板块 */
  .feature{border:3px solid var(--gold);border-radius:10px;background:
    linear-gradient(180deg,#fffdf4,#f8eecd);padding:18px 20px;box-shadow:4px 5px 0 rgba(0,0,0,.12);}
  .feature .fh{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:20px;
    color:var(--red);letter-spacing:3px;border-bottom:2px dashed var(--gold);padding-bottom:8px;}
  .feature .fh::before{content:"★";color:var(--gold);font-size:18px;}
  .fsec{margin-bottom:16px;}
  .fsec:last-child{margin-bottom:0;}
  .fsec h4{margin:0 0 8px;font-size:16px;color:var(--red);
    border-left:5px solid var(--gold);padding-left:10px;letter-spacing:1px;background:#fbeccf;
    border-radius:0 4px 4px 0;padding-top:2px;padding-bottom:2px;}
  .qrow{margin:0 0 12px;padding:0 0 12px;border-bottom:1px dashed #d8c391;}
  .qrow:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
  .qq{margin:0;font-size:15px;color:#3a2c16;line-height:1.85;text-align:center;
    font-family:"KaiTi","STKaiti",serif;}
  .qq::before{content:"「";color:var(--gold);} .qq::after{content:"」";color:var(--gold);}
  .qt{display:block;text-align:center;font-size:12.5px;color:var(--jade);margin:4px 0 0;}
  .qm{margin:6px 0 0;font-size:13.5px;color:#6b5a44;line-height:1.75;}
  .flist{margin:0;padding-left:0;list-style:none;}
  .flist li{margin:8px 0;line-height:1.75;font-size:14px;padding-left:18px;position:relative;}
  .flist li::before{content:"➤";position:absolute;left:0;top:1px;color:var(--gold);font-size:12px;}
  .flist b{color:var(--red);}
  .fnote{font-size:12.5px;color:#8a5a12;background:#fdf3dd;border:1px dashed var(--gold);
    border-radius:6px;padding:8px 12px;margin:4px 0 0;line-height:1.7;}

  /* 读后想一想（闭环） */
  .closure{border:2px solid var(--jade);border-radius:8px;background:#f0f7f2;
    padding:16px 20px;line-height:1.85;font-size:14.5px;box-shadow:3px 4px 0 rgba(0,0,0,.1);}
  .closure h3{margin:0 0 10px;font-size:16px;color:var(--jade);letter-spacing:2px;
    border-bottom:1px dashed var(--jade);padding-bottom:6px;}
  .closure ol{margin:0;padding-left:22px;}
  .closure li{margin:8px 0;line-height:1.8;}
  .closure li b{color:var(--jade);}
  .closure .ans{color:#6b5a44;font-size:13.5px;}

  /* 前后站导航 */
  .station-nav{display:flex;gap:14px;justify-content:space-between;margin-top:34px;
    padding-top:16px;border-top:2px double var(--line);}
  .station-nav a{flex:1;max-width:46%;text-decoration:none;border:2px solid var(--red);
    border-radius:8px;padding:10px 14px;background:#fffaf0;transition:background .15s,color .15s;}
  .station-nav a:hover{background:var(--red);color:#fff;}
  .station-nav a:hover small{color:#f4ead2;}
  .station-nav a .dir{display:block;font-size:12px;color:var(--jade);margin-bottom:2px;letter-spacing:1px;}
  .station-nav a b{font-size:15px;color:var(--ink);}
  .station-nav a small{display:block;font-size:12px;color:#6b5a44;margin-top:3px;}
  .station-nav a.next{text-align:right;}
  .station-nav a.next .dir{color:var(--red);}

  /* 放大层（研读模式） */
  .lightbox{position:fixed;inset:0;background:rgba(10,8,6,.92);display:none;
    align-items:flex-start;justify-content:center;z-index:50;padding:24px;overflow:auto;}
  .lightbox.open{display:flex;}
  .lb-stage{display:flex;gap:0;width:min(1120px,95vw);max-height:90vh;
    background:var(--paper);border:4px solid var(--line);border-radius:6px;overflow:hidden;
    box-shadow:0 0 44px rgba(0,0,0,.6);}
  .lb-figure{flex:1 1 52%;min-width:0;background:#111;display:flex;align-items:center;justify-content:center;padding:12px;}
  .lb-figure img{max-width:100%;max-height:86vh;border:3px solid #fff;box-shadow:0 0 18px rgba(0,0,0,.5);}
  .lb-study{flex:1 1 48%;min-width:0;overflow-y:auto;padding:18px 20px;background:var(--paper);}
  .lb-study .lb-h{font-size:17px;color:var(--red);letter-spacing:1px;margin:0 0 12px;
    border-bottom:2px solid var(--gold);padding-bottom:6px;}
  .lb-close{position:absolute;top:14px;right:18px;z-index:53;width:40px;height:40px;border-radius:50%;
    border:2px solid rgba(255,255,255,.75);background:rgba(20,16,12,.55);color:#f4ead2;font-size:24px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
  .lb-close:hover{background:rgba(181,48,42,.92);}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:52;
    width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.75);
    background:rgba(20,16,12,.55);color:#f4ead2;font-size:30px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;user-select:none;
    transition:background .15s,transform .15s,box-shadow .15s;}
  .lb-nav:hover{background:rgba(181,48,42,.92);transform:translateY(-50%) scale(1.08);box-shadow:0 0 18px rgba(0,0,0,.5);}
  .lb-nav.prev{left:18px;} .lb-nav.next{right:18px;}
  .lb-count{position:absolute;top:16px;left:0;right:0;text-align:center;color:#f4ead2;
    font-size:13px;letter-spacing:2px;opacity:.9;text-shadow:0 1px 3px rgba(0,0,0,.7);z-index:52;}

  @media(max-width:760px){
    .comic{grid-template-columns:1fr;} .panel.span2{grid-column:auto;}
    .cards{grid-template-columns:1fr;}
    .lb-stage{flex-direction:column;max-height:94vh;}
    .lb-figure img{max-height:38vh;}
    .lb-study{max-height:none;}
    .lb-nav{width:42px;height:42px;font-size:24px;} .lb-nav.prev{left:8px;} .lb-nav.next{right:8px;}
    .station-nav{flex-direction:column;} .station-nav a{max-width:100%;}
  }
  @media(prefers-reduced-motion:no-preference){
    .panel{transition:transform .15s ease;}
    .panel:hover{transform:translateY(-2px);}
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">← 返回《西游记》路线图</a>
  <div class="masthead">
    <div class="title-v">__TITLE__</div>
    <div class="title-sub">__SUB__</div>
    <div class="seal">__SEAL__</div>
  </div>

  <!-- 重点精读徽章 + 回目出处（普通站注入空） -->
  __HUIMU__

  <!-- 页内目录 -->
  __TOC__

  <!-- 整回导读 -->
  <div class="lead">__LEAD__</div>

  <div class="comic" id="comic"></div>

  <div class="toolbar">
    <button id="replay">↺ 从头看</button>
    <button id="toggleStudy" class="ghost">📖 展开逐格研读笔记</button>
  </div>
  <div class="note">
    点击任意分镜可进入<b>研读模式</b>（大图 + 导读卡），用底部 <b>‹ ›</b> 或键盘 <b>← →</b> 翻看上一张 / 下一张，<b>Esc</b> 或点击背景关闭。<br>
    也可点上方「展开逐格研读笔记」，在页面下方一次性读完各格的研读内容。
  </div>

  <!-- 主页面研读笔记 -->
  <div class="studies" id="studies"></div>

  <!-- 重点精读板块（普通站注入空） -->
  __FEATURE__

  <!-- 人物小档案 -->
  <div class="section-title" id="chars">👥 人物小档案</div>
  <div class="cards">__CHARS__</div>

  <!-- 主题探究 -->
  <div class="section-title" id="themes">🧭 主题探究</div>
  <div class="prose">__THEMES__</div>

  <!-- 读后想一想（闭环） -->
  __CLOSURE__

  <!-- 阅读小贴士 -->
  <div class="section-title" id="tips">💡 阅读小贴士</div>
  <div class="prose"><ul>__TIPS__</ul></div>

  <!-- 前后站导航 -->
  __NAV__
</div>

<!-- 放大层：研读模式 -->
<div class="lightbox" id="lb">
  <button class="lb-nav prev" id="lbPrev" type="button" aria-label="上一张">‹</button>
  <button class="lb-nav next" id="lbNext" type="button" aria-label="下一张">›</button>
  <div class="lb-stage">
    <div class="lb-figure"><img id="lbImg" alt=""></div>
    <div class="lb-study" id="lbStudy"></div>
  </div>
  <div class="lb-count" id="lbCount"></div>
  <button class="lb-close" id="lbClose" type="button" aria-label="关闭">×</button>
</div>

<script>
const DATA = __DATA__;

/* ============ 分类语料卡 HTML ============ */
function vocabHTML(v){
  if(!v) return '';
  let h = '';
  if(v.words && v.words.length){
    h += '<div class="sec"><h4>📚 好词</h4><ul class="vw">';
    v.words.forEach(w=>{ h += '<li><b>'+w.t+'</b> <span class="wm">'+w.m+'</span></li>'; });
    h += '</ul></div>';
  }
  if(v.ju && v.ju.length){
    h += '<div class="sec"><h4>✒️ 佳句</h4>';
    v.ju.forEach(j=>{ h += '<blockquote class="vq"><p>“'+j.t+'”</p><cite>— '+j.from+'</cite><span class="vm">'+j.m+'</span></blockquote>'; });
    h += '</div>';
  }
  if(v.rhet && v.rhet.length){
    h += '<div class="sec"><h4>🎨 修辞</h4><ul class="vw rhet">';
    v.rhet.forEach(r=>{ h += '<li><b>'+r.t+'</b> <span class="wm">'+r.m+'</span></li>'; });
    h += '</ul></div>';
  }
  return h;
}

/* ============ 研读卡 HTML ============ */
function studyHTML(p){
  let h = '<div class="sec"><h4>📖 导读</h4><p>'+p.study.intro+'</p></div>';
  h += '<div class="sec"><h4>🔍 赏析</h4><p>'+p.study.appreciate+'</p></div>';
  h += '<div class="sec"><h4>💡 思考</h4><ul>';
  p.study.think.forEach(t=>{ h += '<li>'+t+'</li>'; });
  h += '</ul></div>';
  if(p.study.vocab){
    h += vocabHTML(p.study.vocab);
  } else if(p.study.phrases){
    h += '<div class="sec"><h4>✨ 好词佳句</h4><p>';
    p.study.phrases.forEach(ph=>{ h += '<span class="ph">'+ph+'</span>'; });
    h += '</p></div>';
  }
  return h;
}

/* ============ 渲染漫画 ============ */
function build(){
  const root = document.getElementById('comic');
  root.innerHTML = '';
  DATA.panels.forEach((p, i)=>{
    const el = document.createElement('div');
    el.className = 'panel' + (p.span ? ' span2' : '');
    const shot = document.createElement('div');
    shot.className = 'shot';
    shot.style.backgroundImage = `url("${p.img}")`;
    shot.style.backgroundSize = 'contain';
    shot.style.backgroundPosition = 'center';
    el.appendChild(shot);
    (function (p, shot, el) {
      const im = new Image();
      im.onerror = function () {
        shot.style.backgroundImage = 'none';
        shot.style.background = 'linear-gradient(135deg,#d8b25a,#b5302a)';
        if (!el.querySelector('.missing-lab')) {
          const lab = document.createElement('div');
          lab.className = 'missing-lab';
          lab.textContent = '分镜示意图（AI 图待生成）';
          el.appendChild(lab);
        }
      };
      im.src = p.img;
    })(p, shot, el);
    const scan = document.createElement('div'); scan.className='scan'; el.appendChild(scan);
    const vig = document.createElement('div'); vig.className='vig'; el.appendChild(vig);
    const badge = document.createElement('div'); badge.className='badge'; badge.textContent='第 '+(i+1)+' 格 · 研读'; el.appendChild(badge);

    if(p.caption){
      const c = document.createElement('div'); c.className='caption'; c.textContent = p.caption;
      el.appendChild(c);
    }
    (p.bubbles||[]).forEach(b=>{
      const d = document.createElement('div');
      d.className = 'bubble' + (b.kind?(' '+b.kind):'') + (' '+(b.side||'l'));
      d.innerHTML = '<span class="who">'+(b.who||'')+'</span>'+b.text;
      d.style.left = (b.side==='r'?null:'8%');
      d.style.right = (b.side==='r'?'8%':null);
      d.style.bottom = '14%';
      el.appendChild(d);
    });
    if(p.sfx && p.sfx.t){
      const s = document.createElement('div'); s.className='sfx'; s.textContent = p.sfx.t;
      s.style.left = p.sfx.x; s.style.top = p.sfx.y; el.appendChild(s);
    }
    el.addEventListener('click', ()=>openLB(i));
    root.appendChild(el);
  });
}

/* ============ 主页面研读笔记 ============ */
function buildStudies(){
  const box = document.getElementById('studies');
  box.innerHTML = '';
  DATA.panels.forEach((p, i)=>{
    const card = document.createElement('div');
    card.className = 'study-card';
    card.innerHTML =
      '<div class="head"><img src="'+p.img+'" alt="">'+
      '<b>第 '+(i+1)+' 格 · '+ (p.caption||'').slice(0,18) +'…</b></div>'+
      '<div class="body">'+ studyHTML(p) +'</div>';
    box.appendChild(card);
  });
}

/* ============ 放大层（研读模式）+ 翻页 ============ */
const lb = document.getElementById('lb');
const lbImg = document.getElementById('lbImg');
const lbStudy = document.getElementById('lbStudy');
const lbCount = document.getElementById('lbCount');
let lbIdx = 0;

function showLB(i){
  lbIdx = (i % DATA.panels.length + DATA.panels.length) % DATA.panels.length;
  const p = DATA.panels[lbIdx];
  lbImg.src = p.img;
  lbStudy.innerHTML = '<div class="lb-h">第 '+(lbIdx+1)+' 格 · 研读</div>' + studyHTML(p);
  lbStudy.scrollTop = 0;
  lbCount.textContent = '第 ' + (lbIdx + 1) + ' / ' + DATA.panels.length + ' 格';
}
function openLB(i){ showLB(i); lb.classList.add('open'); }

document.getElementById('lbPrev').addEventListener('click', (e)=>{ e.stopPropagation(); showLB(lbIdx - 1); });
document.getElementById('lbNext').addEventListener('click', (e)=>{ e.stopPropagation(); showLB(lbIdx + 1); });
document.getElementById('lbClose').addEventListener('click', (e)=>{ e.stopPropagation(); lb.classList.remove('open'); });
lb.addEventListener('click', (e)=>{ if(e.target === lb) lb.classList.remove('open'); });
document.addEventListener('keydown', (e)=>{
  if(!lb.classList.contains('open')) return;
  if(e.key === 'ArrowLeft'){ showLB(lbIdx - 1); }
  else if(e.key === 'ArrowRight'){ showLB(lbIdx + 1); }
  else if(e.key === 'Escape'){ lb.classList.remove('open'); }
});

const studyBtn = document.getElementById('toggleStudy');
studyBtn.addEventListener('click', ()=>{
  const box = document.getElementById('studies');
  box.classList.toggle('open');
  studyBtn.textContent = box.classList.contains('open') ? '📕 收起逐格研读笔记' : '📖 展开逐格研读笔记';
  if(box.classList.contains('open')) box.scrollIntoView({behavior:'smooth', block:'start'});
});

document.getElementById('replay').addEventListener('click', ()=>window.scrollTo({top:0,behavior:'smooth'}));
build();
buildStudies();
</script>
