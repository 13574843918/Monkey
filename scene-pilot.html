<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>场景样板 · 白虎岭三打白骨精</title>
<style>
  :root{
    --ink:#2b2118; --paper:#f3ead6; --paper2:#e7d8b6;
    --gold:#c9a23a; --gold-d:#9c7a23; --red:#b23a2e; --jade:#3f9e8c;
    --shadow:rgba(40,28,12,.22);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:
      radial-gradient(1200px 600px at 50% -10%, #fbf4e2, #ece0c4 60%, #e2d2af 100%);
    color:var(--ink); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:28px 16px 60px;
  }
  .frame{max-width:1000px;margin:0 auto;}
  .titlebar{display:flex;align-items:center;gap:14px;margin:0 4px 14px;}
  .seal{
    width:62px;height:62px;flex:none;border-radius:12px;
    background:linear-gradient(160deg,var(--red),#7d211a);
    color:#ffe9c8;display:grid;place-items:center;text-align:center;
    font-weight:800;font-size:17px;line-height:1.05;
    box-shadow:0 6px 18px rgba(140,40,30,.4),inset 0 0 0 2px rgba(255,225,180,.35);
    letter-spacing:1px;
  }
  .titlebar h1{font-size:24px;margin:0;letter-spacing:2px;}
  .titlebar p{margin:4px 0 0;font-size:13px;color:#7a6a4e;}
  .stage{
    position:relative;height:480px;border-radius:20px;overflow:hidden;
    box-shadow:0 18px 50px rgba(60,40,10,.35),inset 0 0 0 1px rgba(120,90,30,.25);
    background:#cdd6cf;
  }
  .bg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .cast{position:absolute;inset:0;}
  .puppet{
    position:absolute;bottom:6%;width:160px;height:300px;
    transform-origin:bottom center;transition:transform .25s ease,filter .25s ease;
  }
  .fig{width:100%;height:100%;overflow:visible;display:block;}
  .pet-name{
    position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
    background:rgba(43,33,24,.86);color:#fbe9c6;font-size:12px;
    padding:3px 10px;border-radius:999px;white-space:nowrap;letter-spacing:1px;
    box-shadow:0 3px 8px rgba(0,0,0,.3);
  }
  .bubble{
    position:absolute;left:50%;top:14px;transform:translate(-50%,-100%) scale(.6);
    max-width:170px;min-width:64px;padding:8px 12px;border-radius:14px;
    background:#fff8ec;color:#2b2118;font-size:13.5px;line-height:1.5;
    box-shadow:0 8px 20px rgba(0,0,0,.28);opacity:0;pointer-events:none;
    transition:opacity .18s ease,transform .18s cubic-bezier(.2,1.4,.4,1);
    border:1px solid rgba(150,110,40,.35);text-align:center;
  }
  .bubble:after{
    content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);
    border:9px solid transparent;border-top-color:#fff8ec;
  }
  .puppet.speaking{z-index:50;filter:drop-shadow(0 0 12px rgba(255,210,120,.7));}
  .puppet.speaking .bubble{opacity:1;transform:translate(-50%,-100%) scale(1);}
  .puppet.speaking .fig{animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* 动作 */
  @keyframes a-swing{0%,100%{transform:rotate(0)}20%{transform:rotate(-9deg)}45%{transform:rotate(8deg)}70%{transform:rotate(-4deg)}}
  @keyframes a-warn{0%,100%{transform:translateX(0)}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-5px)}60%{transform:translateX(4px)}}
  @keyframes a-cast{0%{transform:scale(1)}40%{transform:scale(1.09)}100%{transform:scale(1)}}
  @keyframes a-laugh{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-8px) rotate(-3deg)}55%{transform:translateY(-3px) rotate(3deg)}}
  @keyframes a-fear{0%,100%{transform:scale(1)}50%{transform:scale(.92) translateY(6px)}}
  @keyframes a-bow{0%,100%{transform:rotate(0)}50%{transform:rotate(13deg) translateY(4px)}}
  @keyframes a-boast{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
  @keyframes a-descend{0%{transform:translateY(-120px);opacity:0}100%{transform:translateY(0);opacity:1}}
  @keyframes a-cry{0%,100%{transform:translateY(0)}30%{transform:translateY(3px) rotate(-2deg)}60%{transform:translateY(-2px) rotate(2deg)}}
  @keyframes a-think{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg)}}
  @keyframes a-calm{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .a-swing .fig{animation:a-swing .8s ease;}
  .a-warn .fig{animation:a-warn .6s ease;}
  .a-cast .fig{animation:a-cast .6s ease;}
  .a-laugh .fig{animation:a-laugh .9s ease;}
  .a-fear .fig{animation:a-fear .6s ease;}
  .a-bow .fig{animation:a-bow 1s ease;}
  .a-boast .fig{animation:a-boast .7s ease;}
  .a-descend .fig{animation:a-descend .9s cubic-bezier(.2,.8,.3,1);}
  .a-cry .fig{animation:a-cry .8s ease;}
  .a-think .fig{animation:a-think 1.4s ease;}
  .a-calm .fig{animation:a-calm 2s ease;}

  /* 背景动效 */
  .cloud-drift{animation:drift 30s linear infinite;}
  .cloud-drift.s2{animation-duration:42s;animation-direction:reverse;}
  .mist{animation:mist 16s ease-in-out infinite alternate;}
  .mist.s2{animation-duration:22s;animation-delay:-6s;}
  @keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
  @keyframes mist{from{transform:translateX(-18px);opacity:.5}to{transform:translateX(18px);opacity:.85}}
  .float-bone{animation:floatb 4.2s ease-in-out infinite;}
  @keyframes floatb{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .sway{transform-origin:bottom center;animation:sway 3.4s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(4deg)}}

  .dialog{
    margin:16px 4px 0;background:#fff8ec;border-radius:14px;padding:14px 18px;
    min-height:64px;box-shadow:0 8px 22px rgba(80,55,15,.18),inset 0 0 0 1px rgba(160,120,40,.25);
    display:flex;gap:14px;align-items:flex-start;
  }
  .sd-speaker{
    flex:none;align-self:center;font-weight:800;font-size:14px;color:#fff;
    background:var(--gold-d);padding:6px 12px;border-radius:999px;letter-spacing:1px;
    box-shadow:0 3px 8px rgba(0,0,0,.2);
  }
  .sd-speaker.sp-god{background:var(--jade);}
  .sd-speaker.sp-demon{background:#5d3a6e;}
  .sd-speaker.sp-folk{background:#6b7b74;}
  .sd-text{margin:0;font-size:16px;line-height:1.7;letter-spacing:.5px;}
  .sd-text:after{content:"▍";color:var(--gold);animation:caret .8s steps(1) infinite;}
  .sd-text.done:after{content:"";}
  @keyframes caret{50%{opacity:0}}

  .controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:16px 0 0;}
  .controls button{
    width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(160deg,#fbf1d8,#e8d3a4);color:#6b4e16;font-size:17px;
    box-shadow:0 5px 14px rgba(90,60,15,.28),inset 0 0 0 1px rgba(150,110,40,.4);
    transition:transform .12s ease,filter .12s ease;
  }
  .controls button:hover{filter:brightness(1.06);transform:translateY(-2px);}
  .controls button:active{transform:translateY(1px);}
  .controls .play{width:56px;height:56px;font-size:20px;
    background:linear-gradient(160deg,var(--red),#812019);color:#ffe9c8;
    box-shadow:0 6px 16px rgba(140,40,30,.4),inset 0 0 0 1px rgba(255,225,180,.35);}
  .dots{display:flex;gap:8px;margin-left:6px;}
  .dots i{width:9px;height:9px;border-radius:50%;background:#cdb98a;cursor:pointer;transition:.2s;}
  .dots i.on{background:var(--red);transform:scale(1.25);}

  .note{margin:22px 4px 0;font-size:12.5px;color:#8a785a;line-height:1.7;
    border-top:1px dashed rgba(140,100,40,.4);padding-top:14px;}
  @media (prefers-reduced-motion: reduce){
    .cloud-drift,.mist,.float-bone,.sway,.puppet.speaking .fig,
    .a-swing .fig,.a-warn .fig,.a-cast .fig,.a-laugh .fig,.a-fear .fig,.a-bow .fig,
    .a-boast .fig,.a-descend .fig,.a-cry .fig,.a-think .fig,.a-calm .fig{animation:none !important;}
  }
</style>
</head>
<body>
<div class="frame">
  <div class="titlebar">
    <div class="seal">场景<br>样板</div>
    <div>
      <h1>白虎岭 · 三打白骨精</h1>
      <p>视觉语言升级样板稿（人物 / 妖怪 / 神仙 三类同台）· 待你确认后铺开至全部 42 站</p>
    </div>
  </div>

  <div class="stage" id="stage">
    <svg class="bg" viewBox="0 0 1000 480" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a4a63"/><stop offset=".55" stop-color="#6b7088"/>
          <stop offset="1" stop-color="#9aa0ad"/>
        </linearGradient>
        <radialGradient id="gMoon" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#fdfbe8"/><stop offset=".7" stop-color="#e9efd6"/>
          <stop offset="1" stop-color="#e9efd6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="gMtnFar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7d8597"/><stop offset="1" stop-color="#9aa0ad"/>
        </linearGradient>
        <linearGradient id="gMtnMid" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#566175"/><stop offset="1" stop-color="#737d8f"/>
        </linearGradient>
        <linearGradient id="gMtnNear" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a4253"/><stop offset="1" stop-color="#586073"/>
        </linearGradient>
        <linearGradient id="gGround" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6f7a5e"/><stop offset="1" stop-color="#566049"/>
        </linearGradient>
      </defs>

      <rect x="0" y="0" width="1000" height="480" fill="url(#gSky)"/>
      <circle cx="812" cy="104" r="120" fill="url(#gMoon)"/>
      <circle cx="812" cy="104" r="58" fill="#fdfbe8"/>

      <!-- 远山 -->
      <path d="M0 300 L150 188 L300 300 Z" fill="url(#gMtnFar)" opacity=".8"/>
      <path d="M230 300 L430 150 L620 300 Z" fill="url(#gMtnFar)" opacity=".8"/>
      <path d="M560 300 L780 172 L1000 300 Z" fill="url(#gMtnFar)" opacity=".8"/>
      <!-- 中山 -->
      <path d="M0 330 L210 206 L420 330 Z" fill="url(#gMtnMid)"/>
      <path d="M360 330 L600 196 L860 330 Z" fill="url(#gMtnMid)"/>
      <path d="M740 330 L940 214 L1000 290 L1000 330 Z" fill="url(#gMtnMid)"/>
      <!-- 松树剪影（中景） -->
      <g fill="#3c4757" opacity=".9">
        <path d="M120 320 L100 250 L140 250 Z M110 290 L90 250 L130 250 Z M104 320 L88 270 L120 270 Z"/>
        <path d="M880 322 L862 256 L898 256 Z M870 296 L852 260 L892 260 Z"/>
      </g>
      <!-- 近山 -->
      <path d="M0 360 L180 268 L380 360 Z" fill="url(#gMtnNear)"/>
      <path d="M520 360 L720 262 L1000 360 Z" fill="url(#gMtnNear)"/>

      <!-- 雾带 -->
      <g class="mist">
        <path d="M-40 286 q120 -26 240 0 t240 0 t240 0 t240 0" fill="none" stroke="#cdd3da" stroke-width="14" stroke-linecap="round" opacity=".55"/>
      </g>
      <g class="mist s2">
        <path d="M-60 320 q140 -22 280 0 t280 0 t280 0" fill="none" stroke="#dfe4ea" stroke-width="12" stroke-linecap="round" opacity=".5"/>
      </g>

      <!-- 祥云（国潮） -->
      <g class="cloud-drift" fill="#e9eef0" opacity=".5">
        <path d="M150 120 q22 -30 60 -16 q16 -34 60 -18 q44 -12 52 24 q34 -2 26 28 q26 8 6 28 H150 Z"/>
      </g>
      <g class="cloud-drift s2" fill="#dfe6e8" opacity=".42">
        <path d="M620 86 q18 -26 50 -14 q14 -28 50 -15 q36 -10 44 20 q28 -2 22 24 q22 8 4 24 H620 Z"/>
      </g>

      <!-- 地面 -->
      <path d="M0 356 Q500 336 1000 356 L1000 480 L0 480 Z" fill="url(#gGround)"/>
      <!-- 前景岩石与草 -->
      <g fill="#454f3c">
        <path d="M40 470 q40 -40 96 -22 q30 -20 64 4 q-20 30 -90 30 q-44 2 -70 -12 Z"/>
        <path d="M820 472 q44 -36 104 -18 q26 -18 56 2 q-22 28 -92 28 q-42 0 -68 -12 Z"/>
      </g>
      <g stroke="#5a6647" stroke-width="3" stroke-linecap="round">
        <path d="M150 462 q-4 -22 -2 -34 M158 462 q6 -20 14 -30 M145 462 q-10 -16 -16 -26"/>
        <path d="M880 464 q-4 -20 -2 -32 M888 464 q6 -18 14 -28 M875 464 q-10 -14 -16 -24"/>
      </g>
    </svg>

    <div class="cast" id="cast"></div>
  </div>

  <div class="dialog">
    <span class="sd-speaker" id="sp">白骨精</span>
    <p class="sd-text" id="txt"></p>
  </div>

  <div class="controls">
    <button id="prev" title="上一句">⏮</button>
    <button id="play" class="play" title="播放 / 暂停">▶</button>
    <button id="next" title="下一句">⏭</button>
    <button id="replay" title="重播">↺</button>
    <div class="dots" id="dots"></div>
  </div>

  <p class="note">
    说明：本页为「人物 / 妖怪 / 神仙」三类角色的同台样板，仅用于确认<b>新视觉方向</b>。
    确认后，我会把这套更精细的 SVG 立绘与分层场景接入现有 `app.js` / `data.js` / `style.css`，
    并替换原来的简笔木偶，铺开到全部 42 站。若哪个人物想再调（脸型、配色、兵器、比例），告诉我即可。
  </p>
</div>

<script>
/* ---------- 共享渐变（角色立绘用） ---------- */
var DEFS = '<svg width="0" height="0" style="position:absolute" aria-hidden="true">'+
'<defs>'+
'<linearGradient id="gTang" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cf4a35"/><stop offset="1" stop-color="#9c2b1e"/></linearGradient>'+
'<linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d98a"/><stop offset="1" stop-color="#c9a23a"/></linearGradient>'+
'<linearGradient id="gArmor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3cf6a"/><stop offset="1" stop-color="#c79a2e"/></linearGradient>'+
'<linearGradient id="gSkirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c98c"/><stop offset="1" stop-color="#c79a52"/></linearGradient>'+
'<linearGradient id="gStaff" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#d9a93a"/></linearGradient>'+
'<linearGradient id="gBone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef4ee"/><stop offset="1" stop-color="#c9d8cf"/></linearGradient>'+
'<linearGradient id="gGod" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fb9a6"/><stop offset="1" stop-color="#4d8e7c"/></linearGradient>'+
'<radialGradient id="gHalo" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe9a8" stop-opacity=".9"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>'+
'</defs></svg>';
document.body.insertAdjacentHTML('afterbegin', DEFS);

/* ---------- 角色立绘（viewBox 0 0 200 360，脚底 y≈345） ---------- */
function shadow(){return '<ellipse cx="100" cy="348" rx="40" ry="9" fill="rgba(20,20,40,.2)"/>';}

function svgTang(){
  return shadow()+
  // 锡杖（右侧）
  '<g><line x1="150" y1="120" x2="150" y2="338" stroke="url(#gGold)" stroke-width="5" stroke-linecap="round"/>'+
  '<circle cx="150" cy="116" r="6" fill="#b23a2e"/><circle cx="150" cy="134" r="5" fill="none" stroke="#c9a23a" stroke-width="3"/>'+
  '<circle cx="150" cy="150" r="5" fill="none" stroke="#c9a23a" stroke-width="3"/></g>'+
  // 袈裟主体
  '<path d="M66 170 Q100 146 134 170 L148 344 Q100 358 52 344 Z" fill="url(#gTang)"/>'+
  // 衣纹
  '<path d="M100 168 L100 344 M80 180 L72 338 M120 180 L128 338" stroke="#7d1d14" stroke-width="2" opacity=".5" fill="none"/>'+
  // 袈裟金格
  '<g fill="url(#gGold)" opacity=".95">'+
  '<rect x="76" y="206" width="16" height="16" rx="3"/><rect x="108" y="206" width="16" height="16" rx="3"/>'+
  '<rect x="84" y="244" width="16" height="16" rx="3"/><rect x="116" y="244" width="16" height="16" rx="3"/>'+
  '<rect x="92" y="284" width="16" height="16" rx="3"/></g>'+
  // 内衫领
  '<path d="M86 160 Q100 176 114 160 L112 192 Q100 200 88 192 Z" fill="#f3e6cf"/>'+
  // 束带
  '<rect x="58" y="244" width="84" height="15" rx="7" fill="url(#gGold)"/>'+
  // 手（合十）
  '<ellipse cx="100" cy="232" rx="13" ry="10" fill="#f4d3b0"/>'+
  // 头
  '<circle cx="100" cy="112" r="33" fill="#f4d3b0"/>'+
  '<ellipse cx="74" cy="116" rx="6" ry="9" fill="#f4d3b0"/><ellipse cx="126" cy="116" rx="6" ry="9" fill="#f4d3b0"/>'+
  // 五官
  '<path d="M84 104 q6 -5 12 0 M104 104 q6 -5 12 0" stroke="#5a3b22" stroke-width="2.4" fill="none" stroke-linecap="round"/>'+
  '<ellipse cx="90" cy="112" rx="3.2" ry="4" fill="#3a2616"/><ellipse cx="110" cy="112" rx="3.2" ry="4" fill="#3a2616"/>'+
  '<path d="M94 128 q6 5 12 0" stroke="#b5634a" stroke-width="2.4" fill="none" stroke-linecap="round"/>'+
  '<circle cx="82" cy="122" r="4" fill="#e89a86" opacity=".6"/><circle cx="118" cy="122" r="4" fill="#e89a86" opacity=".6"/>'+
  // 僧帽
  '<path d="M66 98 Q100 36 134 98 Z" fill="#33405c"/>'+
  '<path d="M66 98 Q100 36 134 98" fill="none" stroke="url(#gGold)" stroke-width="4"/>'+
  '<circle cx="100" cy="50" r="5" fill="url(#gGold)"/>';
}

function svgWukong(){
  return shadow()+
  // 尾巴
  '<path class="sway" d="M150 300 q44 12 32 -34 q-6 -20 16 -18" stroke="#d98b3e" stroke-width="9" fill="none" stroke-linecap="round"/>'+
  // 披风
  '<path d="M58 172 Q26 226 50 308 Q70 300 84 300 Q66 240 78 176 Z" fill="#9c2b1e" opacity=".55"/>'+
  // 腿
  '<path d="M82 256 L78 340 L96 340 L98 256 Z" fill="#a8431f"/><path d="M118 256 L122 340 L104 340 L102 256 Z" fill="#a8431f"/>'+
  // 虎皮裙
  '<path d="M62 250 Q100 240 138 250 L144 332 Q100 346 56 332 Z" fill="url(#gSkirt)"/>'+
  '<g fill="#7a5320" opacity=".7"><circle cx="80" cy="278" r="5"/><circle cx="110" cy="272" r="5"/><circle cx="96" cy="300" r="5"/><circle cx="124" cy="300" r="5"/><circle cx="74" cy="312" r="4"/></g>'+
  // 甲胄
  '<path d="M68 168 Q100 150 132 168 L138 256 Q100 268 62 256 Z" fill="url(#gArmor)"/>'+
  '<g stroke="#a87d20" stroke-width="2" opacity=".7" fill="none"><path d="M70 192 Q100 184 130 192 M68 212 Q100 204 132 212 M66 232 Q100 224 134 232"/></g>'+
  // 护肩
  '<path d="M54 166 Q60 146 84 160 Q72 172 64 184 Z" fill="#6b3aa0"/><path d="M146 166 Q140 146 116 160 Q128 172 136 184 Z" fill="#6b3aa0"/>'+
  // 内衫领
  '<path d="M86 160 Q100 174 114 160 L110 188 Q100 194 90 188 Z" fill="#b23a2e"/>'+
  // 右臂举棒
  '<path d="M126 176 Q150 150 158 120" stroke="url(#gArmor)" stroke-width="14" fill="none" stroke-linecap="round"/>'+
  '<circle cx="158" cy="118" r="8" fill="#e7a85a"/>'+
  // 金箍棒
  '<line x1="168" y1="60" x2="58" y2="330" stroke="url(#gStaff)" stroke-width="9" stroke-linecap="round"/>'+
  '<line x1="160" y1="80" x2="150" y2="104" stroke="#b23a2e" stroke-width="9"/><line x1="78" y1="288" x2="68" y2="312" stroke="#b23a2e" stroke-width="9"/>'+
  '<circle cx="166" cy="62" r="5" fill="#ffe9a8"/>'+
  // 头（猴脸）
  '<circle cx="100" cy="122" r="30" fill="#e7a85a"/>'+
  '<ellipse cx="100" cy="134" rx="20" ry="16" fill="#f6d9a8"/>'+
  // 耳
  '<path d="M70 118 q-12 -6 -10 -18 q10 2 14 14 Z" fill="#e7a85a"/><path d="M130 118 q12 -6 10 -18 q-10 2 -14 14 Z" fill="#e7a85a"/>'+
  // 火眼金睛
  '<ellipse cx="88" cy="118" rx="10" ry="8" fill="#c0392b" opacity=".9"/><ellipse cx="112" cy="118" rx="10" ry="8" fill="#c0392b" opacity=".9"/>'+

/* ---------- 数据：白虎岭（4 人同台） ---------- */
var CAST = [
  { w:'tang',   k:'tang',  label:'唐僧',   svg:svgTang,   left:16 },
  { w:'wukong', k:'wukong',label:'孙悟空', svg:svgWukong, left:42 },
  { w:'baigu',  k:'demon', label:'白骨精', svg:svgBaigu,  left:70 },
  { w:'tudi',   k:'god',   label:'土地神', svg:svgTudi,   left:88 }
];
var LINES = [
  { w:'baigu',  t:'长老，荒山寂寂，奴家特送斋饭一钵，万望笑纳。', a:'laugh' },
  { w:'wukong', t:'妖精！休要害人，吃俺老孙识破！', a:'warn' },
  { w:'tang',   t:'悟空，你又行凶滥杀，全无一点慈悲。', a:'fear' },
  { w:'baigu',  t:'哈哈，这蠢和尚已被我惑住，唐僧肉吃得成了！', a:'boast' },
  { w:'tudi',   t:'大圣且慢，此乃白骨夫人，三度变化戏弄长老。', a:'descend' },
  { w:'wukong', t:'任你千变万化，也难逃俺这如意金箍棒！', a:'swing' }
];

var KLASS = { tang:'sp-folk', wukong:'sp-folk', demon:'sp-demon', god:'sp-god' };
var LABEL = { tang:'唐僧', wukong:'孙悟空', baigu:'白骨精', tudi:'土地神' };

/* ---------- 渲染 ---------- */
var castBox = document.getElementById('cast');
var els = {};
CAST.forEach(function(m){
  var el = document.createElement('div');
  el.className = 'puppet pet-'+m.k;
  el.style.left = m.left+'%';
  el.innerHTML = '<div class="bubble" data-b="1"></div>'+
                 '<svg class="fig" viewBox="0 0 200 360">'+m.svg()+'</svg>'+
                 '<div class="pet-name">'+m.label+'</div>';
  castBox.appendChild(el);
  els[m.w] = el;
});

var idx = 0, playing = false, typeTimer = null, holdTimer = null;
var sp = document.getElementById('sp'), txt = document.getElementById('txt');

// 圆点
var dots = document.getElementById('dots');
dots.innerHTML = LINES.map(function(_,i){return '<i data-n="'+i+'"></i>';}).join('');
dots.querySelectorAll('i').forEach(function(d){
  d.addEventListener('click', function(){ stepTo(+d.dataset.n); });
});

function updateDots(n){ dots.querySelectorAll('i').forEach(function(d,i){ d.classList.toggle('on', i===n); }); }
function updatePlay(){ document.getElementById('play').textContent = playing ? '❚❚' : '▶'; }
function clearT(){ if(typeTimer){clearInterval(typeTimer);typeTimer=null;} if(holdTimer){clearTimeout(holdTimer);holdTimer=null;} }

function typeInto(text){
  clearT();
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    txt.textContent = text; txt.classList.add('done'); return;
  }
  txt.textContent = ''; txt.classList.remove('done');
  var i = 0;
  typeTimer = setInterval(function(){
    txt.textContent = text.slice(0, ++i);
    if (i >= text.length){ clearInterval(typeTimer); typeTimer=null; txt.classList.add('done'); }
  }, 55);
}

function show(n){
  clearT();
  idx = Math.max(0, Math.min(LINES.length-1, n));
  var line = LINES[idx];
  // 重置
  Object.keys(els).forEach(function(w){
    var e = els[w];
    e.className = 'puppet pet-'+ (w==='baigu'?'demon':(w==='tudi'?'god':w));
    e.querySelector('[data-b]').textContent = '';
  });
  // 说话者
  var s = els[line.w];
  if (s){
    var cls = 'puppet pet-'+(line.w==='baigu'?'demon':(line.w==='tudi'?'god':line.w))+' speaking a-'+line.a;
    s.className = cls;
    s.querySelector('[data-b]').textContent = line.t;
  }
  sp.textContent = LABEL[line.w];
  sp.className = 'sd-speaker '+(KLASS[line.w]||'sp-folk');
  typeInto(line.t);
  updateDots(idx);
  if (playing){
    if (idx < LINES.length-1){
      holdTimer = setTimeout(function(){ show(idx+1); }, line.t.length*55 + 1500);
    } else {
      holdTimer = setTimeout(function(){ playing=false; updatePlay(); }, 1600);
    }
  }
}
function step(d){ playing=false; updatePlay(); show(idx+d); }
function stepTo(n){ playing=false; updatePlay(); show(n); }
function toggle(){
  if (playing){ playing=false; clearT(); updatePlay(); return; }
  playing=true; updatePlay();
  if (idx >= LINES.length-1) show(0); else holdTimer = setTimeout(function(){ show(idx+1); }, 400);
}

document.getElementById('prev').addEventListener('click', function(){ step(-1); });
document.getElementById('next').addEventListener('click', function(){ step(1); });
document.getElementById('play').addEventListener('click', toggle);
document.getElementById('replay').addEventListener('click', function(){ playing=true; updatePlay(); show(0); });
document.addEventListener('keydown', function(e){
  if (e.key==='ArrowLeft') step(-1);
  else if (e.key==='ArrowRight') step(1);
  else if (e.key===' '){ e.preventDefault(); toggle(); }
});

// 开场
playing = true; updatePlay(); show(0);
</script>
</body>
</html>
