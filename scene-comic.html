<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>场景样板Ⅱ · 白虎岭分镜连环画</title>
<style>
  :root{
    --ink:#2b2118; --gold:#c9a23a; --gold-d:#9c7a23; --red:#b23a2e; --jade:#3f9e8c;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#fbf4e2,#ece0c4 60%,#e2d2af 100%);
    color:var(--ink);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:28px 16px 60px;}
  .frame{max-width:1040px;margin:0 auto;}
  .titlebar{display:flex;align-items:center;gap:14px;margin:0 4px 14px;}
  .seal{width:62px;height:62px;flex:none;border-radius:12px;background:linear-gradient(160deg,var(--red),#7d211a);
    color:#ffe9c8;display:grid;place-items:center;text-align:center;font-weight:800;font-size:15px;line-height:1.05;
    box-shadow:0 6px 18px rgba(140,40,30,.4),inset 0 0 0 2px rgba(255,225,180,.35);letter-spacing:1px;}
  .titlebar h1{font-size:24px;margin:0;letter-spacing:2px;}
  .titlebar p{margin:4px 0 0;font-size:13px;color:#7a6a4e;}

  .act-bar{display:flex;align-items:center;gap:10px;margin:0 4px 8px;}
  .act-num{font-weight:800;color:#fff;background:linear-gradient(160deg,var(--red),#812019);
    padding:4px 12px;border-radius:999px;font-size:13px;letter-spacing:1px;box-shadow:0 3px 8px rgba(140,40,30,.35);}
  .act-title{font-size:15px;color:#6b4e16;letter-spacing:1px;}

  .stage{position:relative;height:520px;border-radius:20px;overflow:hidden;
    box-shadow:0 18px 50px rgba(60,40,10,.35),inset 0 0 0 1px rgba(120,90,30,.25);background:#1c2230;}
  .stage svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block;
    transition:opacity .5s ease,transform .5s ease;}
  .stage.swap svg.scene{opacity:0;transform:scale(1.04);}
  .bubbles{position:absolute;inset:0;pointer-events:none;}
  .bubble{position:absolute;max-width:230px;padding:9px 13px;border-radius:14px;
    background:#fff8ec;color:#2b2118;font-size:14px;line-height:1.5;
    box-shadow:0 8px 20px rgba(0,0,0,.35);border:1px solid rgba(150,110,40,.4);
    transform:translate(-50%,-50%);opacity:0;transition:opacity .35s ease .15s;}
  .bubble.show{opacity:1;}
  .bubble:after{content:"";position:absolute;width:14px;height:14px;background:#fff8ec;
    border-right:1px solid rgba(150,110,40,.4);border-bottom:1px solid rgba(150,110,40,.4);
    transform:rotate(45deg);}
  .bubble.tl:after{left:22px;bottom:-8px;}
  .bubble.tr:after{right:22px;bottom:-8px;}
  .bubble.bl:after{left:22px;top:-8px;transform:rotate(225deg);}
  .bubble.name{font-weight:800;color:var(--red);font-size:12.5px;display:block;margin-bottom:2px;letter-spacing:1px;}

  .controls{display:flex;justify-content:center;align-items:center;gap:14px;margin:16px 0 0;}
  .controls button{width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;
    background:linear-gradient(160deg,#fbf1d8,#e8d3a4);color:#6b4e16;font-size:17px;
    box-shadow:0 5px 14px rgba(90,60,15,.28),inset 0 0 0 1px rgba(150,110,40,.4);transition:.12s;}
  .controls button:hover{filter:brightness(1.06);transform:translateY(-2px);}
  .controls button:active{transform:translateY(1px);}
  .controls .play{width:56px;height:56px;font-size:20px;background:linear-gradient(160deg,var(--red),#812019);color:#ffe9c8;
    box-shadow:0 6px 16px rgba(140,40,30,.4),inset 0 0 0 1px rgba(255,225,180,.35);}
  .dots{display:flex;gap:9px;margin-left:6px;}
  .dots i{width:10px;height:10px;border-radius:50%;background:#cdb98a;cursor:pointer;transition:.2s;}
  .dots i.on{background:var(--red);transform:scale(1.3);}
  .note{margin:20px 4px 0;font-size:12.5px;color:#8a785a;line-height:1.7;border-top:1px dashed rgba(140,100,40,.4);padding-top:14px;}

  /* 动作/特效 */
  .swing{transform-origin:bottom center;animation:sw .7s ease;}
  @keyframes sw{0%{transform:rotate(0)}30%{transform:rotate(-14deg)}60%{transform:rotate(10deg)}100%{transform:rotate(0)}}
  .floaty{animation:fl 4s ease-in-out infinite;}
  @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .shake{animation:sh .5s ease;}
  @keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
  .morph{animation:morph 1.1s ease forwards;}
  @keyframes morph{0%{opacity:1}100%{opacity:0}}
  .appear{animation:ap 1s ease .2s both;}
  @keyframes ap{0%{opacity:0;transform:scale(.9)}100%{opacity:1;transform:scale(1)}}
  .drift{animation:dr 26s linear infinite;}
  .drift2{animation:dr 38s linear infinite reverse;}
  @keyframes dr{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
  .ray{animation:ray 5s ease-in-out infinite alternate;}
  @keyframes ray{from{opacity:.35}to{opacity:.7}}
  @media (prefers-reduced-motion: reduce){
    .swing,.floaty,.shake,.morph,.appear,.drift,.drift2,.ray{animation:none !important;}
    .stage svg.scene{transition:none;}
  }
</style>
</head>
<body>
<div class="frame">
  <div class="titlebar">
    <div class="seal">分镜<br>样板</div>
    <div><h1>白虎岭 · 三打白骨精</h1>
    <p>新方案：分镜式国潮连环画（人物融入场景 · 动作画出来 · 漫画对白）· 单站样板，确认后铺开</p></div>
  </div>

  <div class="act-bar">
    <span class="act-num" id="actNum">第一幕</span>
    <span class="act-title" id="actTitle">荒岭遇妖</span>
  </div>

  <div class="stage" id="stage">
    <svg class="scene" id="scene" viewBox="0 0 1000 520" preserveAspectRatio="xMidYMid slice"></svg>
    <div class="bubbles" id="bubbles"></div>
  </div>

  <div class="controls">
    <button id="prev" title="上一幕">⏮</button>
    <button id="play" class="play" title="播放/暂停">▶</button>
    <button id="next" title="下一幕">⏭</button>
    <button id="replay" title="重播">↺</button>
    <div class="dots" id="dots"></div>
  </div>

  <p class="note">
    新方案说明：每一幕是一张<strong>完整构图的场景插画</strong>，人物按比例/位置嵌入环境、彼此互动；
    动作靠<strong>绘制的动态</strong>呈现（扑击速度线、金箍棒挥击弧光、村姑碎裂→白骨原形、土地乘祥云降光），
    而非木偶抖动。对话以漫画气泡贴于说话者身旁。确认方向后，我会把"分镜 + 角色姿态库 + 场景模块"接入主线，铺开至 42 站。
  </p>
</div>

  return '<rect width="1000" height="520" fill="#1b2230"/>'+

  '<path d="M-20 360 L210 250 L430 360 Z" fill="#2c3340"/><path d="M360 360 L620 244 L880 360 Z" fill="#2c3340"/><path d="M740 360 L960 252 L1020 360 Z" fill="#2c3340"/>'+
  '<path d="M0 360 Q500 344 1000 360 L1000 520 L0 520 Z" fill="#2b3328"/>'+
  '<g opacity=".5" fill="#3f9e8c"><path d="M120 420 q40 -30 90 -10 q-20 26 -90 24 Z"/><path d="M760 440 q46 -26 100 -8 q-24 24 -100 22 Z"/></g>';
}

/* ===== 四幕 ===== */

      place(figTang(), 300, 150, 1.0, 0)+
      place(figWukong(), 470, 150, 1.0, 0)+
      place(figBaigu('girl'), 770, 130, 1.05, 0)+
      '<g class="drift" opacity=".5" stroke="#bcd0c4" stroke-width="2" fill="none"><path d="M700 360 q20 -16 40 0 t40 0"/></g>',
    bubbles:[ {name:'白骨精', x:80, y:34, dir:'tr', t:'长老，荒山寂寂，奴家特送斋饭一钵，万望笑纳～'} ] },

  { num:'第二幕', title:'火眼识破',

      /* 速度线 */
      '<g stroke="#ffe9a8" stroke-width="3" opacity=".7"><line x1="60" y1="200" x2="300" y2="200"/><line x1="40" y1="250" x2="280" y2="250"/><line x1="70" y1="300" x2="300" y2="300"/></g>'+

    bubbles:[ {name:'孙悟空', x:30, y:30, dir:'tl', t:'妖精！休要害人，吃俺老孙识破！'} ] },

  { num:'第三幕', title:'原形毕露',
    svg: bgDark()+
      /* 村姑碎裂淡出 */

      place(figBaigu('skull'), 500, 120, 1.1, 0)+

      place(figTang(), 200, 160, 0.95, 4)+

      '<g stroke="#7fffcf" stroke-width="2" opacity=".6" fill="none"><path d="M420 180 L470 240 M580 180 L530 240 M500 160 L500 250"/></g>'+

/* ===== 渲染 ===== */
var scene = document.getElementById('scene');
var bubblesBox = document.getElementById('bubbles');
var actNum = document.getElementById('actNum'), actTitle = document.getElementById('actTitle');
var idx=0, playing=false, holdTimer=null;

var dots=document.getElementById('dots');
dots.innerHTML=BEATS.map(function(_,i){return '<i data-n="'+i+'"></i>';}).join('');
dots.querySelectorAll('i').forEach(function(d){d.addEventListener('click',function(){stepTo(+d.dataset.n);});});
function updateDots(n){dots.querySelectorAll('i').forEach(function(d,i){d.classList.toggle('on',i===n);});}
function updatePlay(){document.getElementById('play').textContent=playing?'❚❚':'▶';}

function render(n){
  var b=BEATS[n];
  var stage=document.getElementById('stage');
  stage.classList.add('swap');
  setTimeout(function(){
    scene.innerHTML=b.svg;
    actNum.textContent=b.num; actTitle.textContent=b.title;
    bubblesBox.innerHTML=b.bubbles.map(function(bu){
      return '<div class="bubble show '+(bu.dir||'tl')+'"><span class="name">'+bu.name+'</span>'+bu.t+'</div>';
    }).join('');
    // 定位（百分比）
    Array.prototype.forEach.call(bubblesBox.children,function(el,i){
      el.style.left=b.bubbles[i].x+'%'; el.style.top=b.bubbles[i].y+'%';
    });
    stage.classList.remove('swap');
  },220);
  updateDots(n);
}
function step(d){playing=false;updatePlay();idx=Math.max(0,Math.min(BEATS.length-1,idx+d));render(idx);}
function stepTo(n){playing=false;updatePlay();idx=n;render(idx);}
function next(){if(idx<BEATS.length-1)step(1);else{playing=false;updatePlay();}}
function toggle(){
  if(playing){playing=false;updatePlay();if(holdTimer){clearTimeout(holdTimer);holdTimer=null;}return;}
  playing=true;updatePlay();
  if(idx>=BEATS.length-1){idx=0;render(0);}
  holdTimer=setTimeout(function(){ if(playing) playLoop(); },900);
}
function playLoop(){
  if(!playing)return;
  if(idx<BEATS.length-1){ idx++; render(idx); holdTimer=setTimeout(playLoop, 4200); }
  else { playing=false; updatePlay(); }
}

document.getElementById('prev').addEventListener('click',function(){step(-1);});
document.getElementById('next').addEventListener('click',function(){next();});
document.getElementById('play').addEventListener('click',toggle);
document.getElementById('replay').addEventListener('click',function(){playing=true;updatePlay();idx=0;render(0);holdTimer=setTimeout(playLoop,4200);});
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')step(-1);
  else if(e.key==='ArrowRight')next();
  else if(e.key===' '){e.preventDefault();toggle();}
});

render(0);
</script>
